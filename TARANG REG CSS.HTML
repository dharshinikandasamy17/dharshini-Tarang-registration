
<!DOCTYPE html>
<html>
<head>
    <title>COLLEGE FUNCTION</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
            animation: bgchange 5s infinite alternate;
        }

        /* Background Animation */
        @keyframes bgchange {
            from {
                background-color: #f2f2f2;
            }
            to {
                background-color: #e6ccff;
            }
        }

        /* Banner Animation */
        #banner {
            background-color: purple;
            color: white;
            text-align: center;
            padding: 30px;
            animation: fadein 2s ease-in;
        }

        @keyframes fadein {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        #banner h1 {
            margin: 0;
        }

        /* TARANG Zoom Animation */
        #banner h2 {
            font-size: 30px;
            animation: zoom 2s infinite alternate;
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.2);
            }
        }

        /* Details Slide Animation */
        #details {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px gray;
            animation: slideup 1.5s ease-out;
        }

        @keyframes slideup {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #event-details {
            padding: 20px;
        }

        #event-details h1 {
            color: purple;
        }

        #reg {
            padding: 20px;
            background-color: #eeeeee;
        }

        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            transition: 0.3s;
        }

        /* Input Focus Animation */
        input:focus {
            border-color: purple;
            box-shadow: 0 0 8px violet;
            outline: none;
        }

        /* Button Animation */
        button {
            padding: 10px 20px;
            background-color: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background-color: darkmagenta;
            transform: scale(1.1);
        }

    </style>
</head>

<body>

    <div id="banner">
        <h1>STC | Pollachi</h1>
        <h2>TARANG</h2>
        <p>INTER COLLEGE EVENT, 18/03/2026</p>
    </div>

    <div id="details">

        <div id="event-details">
            <h1>Event Details</h1>
            <h3>Group Dance</h3>
            <p>Participate in the inter college group dance event.</p>
        </div>

        <div id="reg">
            <h1>Registration</h1>

            <form>
                <label>Name:</label>
                <input type="text" name="name" required>
                <br><br>

                <label>College:</label>
                <input type="text" name="college" required>
                <br><br>

                <label>Email:</label>
                <input type="email" name="email" required>
                <br><br>

                <button type="submit">Register</button>
            </form>
        </div>

    </div>

</body>
</html>
